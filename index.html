<!DOCTYPE html>
<html lang="en">

<head>
    <script src="./script.js" defer></script>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>

<body>

    <div class="container">
        <div class="title">
            <p>
                Rock,
            </p>
            <p>Paper,</p>
            <p>Scissors!</p>
        </div>

        <div class="gameAndScore">

            <div class="buttonsContainer">

                <div class="rounds">
                    <h2 style="display: block;">How many rounds do you want to play?</h2>
                    <div class="roundsInput">
                        <label for="rounds">Rounds:</label>
                        <input type="text" name="" id="roundsInput" value="">
                        <button id="startGame" type="button">Start Game</button>
                    </div>
                </div>

                <div class="buttons">
                    <div class="playerButtons">
                        <p>Player</p>
                        <button id="rock">
                            Rock
                        </button>
                        <button id="paper">
                            Paper
                        </button>
                        <button id="scissors">
                            Scissors
                        </button>
                        <p id="subText">**Please select one of the options above.</p>
                    </div>

                    <div class="computerButtons">
                        <p>Computer</p>
                        </p>
                        <button id="rock">
                            Rock
                        </button>
                        <button id="paper">
                            Paper
                        </button>
                        <button id="scissors">
                            Scissors
                        </button>
                    </div>
                </div>

                <div class="resultsContainer">

                </div>

            </div>

        </div>

        <div class="scoreContainer">
            <div class="score">
                Score
                <p>Player: <span id="playerScore">0</span></p>
                <p>Computer: <span id="computerScore">0</span></p>
            </div>

            <div class="overallResult">
                <p id="matchRound"></p>
                <p id="matchResult"></p>
            </div>

            <div class="gameOverSection">
                <p id="gameOver"></p>
                <p></p>
                <p id="gameOverResult"></p>
            </div>

            <button id="playAgain" type="button">Play Again</button>
        </div>

    </div>

</body>

</html>
